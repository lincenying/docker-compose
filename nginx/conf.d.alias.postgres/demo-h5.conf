server {
    listen 80;
    server_name demo-h5.test.com; # 替换为你的域名
    root /home/web/demo-h5;

    # 转发到后端API
    location ^~ /api/ {
        # dc-api-bun-postgre 是 Postgres 栈 API 容器的 container_name, 4080 是容器端口
        proxy_pass http://dc-api-bun-postgre:4080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }
}
