# 上游连接池（compose service name）：复用 TCP，避免每次反代都新建连接
# 必须与 proxy-params.inc 中的 proxy_http_version 1.1 一起使用
# PHP 由 conf.d.php/php.alias.conf 直接 FastCGI 到 app_php，不进这条 HTTP 上游列表

upstream upstream_api {
    server api:4000;
    keepalive 32;
    keepalive_timeout 60s;
}

upstream upstream_nuxt {
    server nuxt:7200;
    keepalive 16;
    keepalive_timeout 60s;
}

upstream upstream_app {
    server app:7777;
    keepalive 16;
    keepalive_timeout 60s;
}
