# 上游连接池（compose service name）：复用 TCP，避免每次反代都新建连接
# 必须与 proxy-params.inc 中的 proxy_http_version 1.1 一起使用
# PHP 上游定义在 conf.d.php/php.alias.conf，避免非 full 栈因 nginx_php 无法解析而启动失败

upstream upstream_api {
    server api:4000;
    keepalive 32;
    keepalive_timeout 60s;
}

upstream upstream_nuxt {
    server nuxt:7200;
    keepalive 16;
    keepalive_timeout 60s;
}

upstream upstream_app {
    server app:7777;
    keepalive 16;
    keepalive_timeout 60s;
}
