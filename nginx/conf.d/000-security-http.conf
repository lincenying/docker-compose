# 防恶意扫描：URI / UA 识别 + 限流（http 上下文）

# 常见漏洞扫描、探针路径（不含 .php，PHP 站点可复用）
map $request_uri $is_scanner_uri {
    default 0;
    ~*(?i)(/\.env|/env\.|/credentials|/id_rsa) 1;
    ~*(?i)(/\.git|/\.svn|/\.hg|/\.bzr|/\.DS_Store) 1;
    ~*(?i)(/wp-admin|/wp-login\.php|/xmlrpc\.php|/wp-content/|/wp-includes/) 1;
    ~*(?i)(/phpmyadmin|/pma/|/adminer|/mysql\.php|/myadmin) 1;
    ~*(?i)(/vendor/phpunit|/phpunit|/eval-stdin\.php) 1;
    ~*(?i)(/actuator|/jolokia|/solr/|/manager/html) 1;
    ~*(?i)(/\.aws/|/latest/meta-data|/cgi-bin/|/shell\.php|/cmd\.php) 1;
    ~*(?i)(/etc/passwd|/proc/self|/debug/default/view|/_ignition|/telescope) 1;
    ~*(?i)(\.\./|%2e%2e|%252e|/\.htaccess|/\.htpasswd|/web\.config) 1;
    ~*(?i)(\.sql\.gz$|\.sql$|\.bak$|\.old$|\.swp$) 1;
    # 脚本后缀(不含.php) / WP / 源码泄露 / 压缩包探测
    ~*(?i)(\.asp($|\?)|\.aspx($|\?)|\.ashx($|\?)|wp-|xmlrpc|wp-login|wp-admin|\.git|\.rar|\.zip|\.gz) 1;
}

# 非 PHP 站点额外拦截 .php 探针
map $request_uri $is_php_probe {
    default 0;
    ~*(?i)\.php($|\?) 1;
}

# 已知扫描器 / 空 UA
map $http_user_agent $is_bad_bot {
    default 0;
    "" 1;
    "-" 1;
    ~*(?i)(nikto|sqlmap|nmap|masscan|zgrab|dirbuster|nessus|openvas|w3af|nuclei|zaproxy|acunetix|appscan|havij|libwww-perl|scrapy|fimap|grabber|pangolin) 1;
}

# WebSocket：有 Upgrade 时切 upgrade；空则保持上游 HTTP/1.1 keepalive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# 静态资源不计入限流。key 为空时 nginx 跳过 limit_req / limit_conn
map $uri $limit_key {
    default $binary_remote_addr;
    ~*\.(?:css|js|mjs|cjs|map|json|webmanifest|png|jpe?g|gif|webp|avif|svg|ico|bmp|woff2?|ttf|eot|otf|mp3|mp4|webm|ogg|wasm)$ "";
}

# 单 IP 请求频率：10r/s，burst 在 server 片段中配置；静态资源见 $limit_key
limit_req_zone $limit_key zone=anti_scan:10m rate=10r/s;

# 单 IP 并发连接数（静态资源同样跳过）
limit_conn_zone $limit_key zone=perip_conn:10m;
