# 上游连接池（host.docker.internal）：复用 TCP，避免每次反代都新建连接
# 必须与 proxy-params.inc 中的 proxy_http_version 1.1 一起使用

upstream upstream_api {
    server host.docker.internal:4000;
    keepalive 32;
    keepalive_timeout 60s;
}

upstream upstream_nuxt {
    server host.docker.internal:7200;
    keepalive 16;
    keepalive_timeout 60s;
}

upstream upstream_app {
    server host.docker.internal:7777;
    keepalive 16;
    keepalive_timeout 60s;
}

upstream upstream_python {
    server host.docker.internal:8006;
    keepalive 8;
    keepalive_timeout 60s;
}
