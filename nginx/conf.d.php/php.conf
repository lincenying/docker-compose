# PHP 上游仅在本文件定义：复制到 conf.d/php.conf 后即可使用（host.docker.internal）
upstream upstream_php {
    server host.docker.internal:8084;
    keepalive 16;
    keepalive_timeout 60s;
}

server {
    listen 80;
    #listen 443 ssl;

    server_name php.test.com;

    include /etc/nginx/conf.d/anti-scan-php.inc;

    # 腾讯云
    #ssl_certificate cert/php.mmxiaowu.com_bundle.crt;
    #ssl_certificate_key cert/php.mmxiaowu.com.key;
    #ssl_protocols TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    # 阿里云
    #ssl_certificate cert/php.mmxiaowu.com.pem;
    #ssl_certificate_key cert/php.mmxiaowu.com.key;
    #ssl_session_cache shared:SSL:1m;
    #ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;

    #ssl_session_timeout 5m;
    #ssl_prefer_server_ciphers on;

    #if ($scheme = http) {
    #    return 301 https://$host$request_uri;
    #}

    location / {
        proxy_pass http://upstream_php;
        include /etc/nginx/conf.d/proxy-params.inc;
    }
}
