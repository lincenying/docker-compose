server {
    listen 80;
    #listen 443 ssl;

    server_name php.test.com;

    include /etc/nginx/conf.d/anti-scan.inc;

    # 腾讯云
    #ssl_certificate cert/php.mmxiaowu.com_bundle.crt;
    #ssl_certificate_key cert/php.mmxiaowu.com.key;
    #ssl_protocols TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    # 阿里云
    #ssl_certificate cert/php.mmxiaowu.com.pem;
    #ssl_certificate_key cert/php.mmxiaowu.com.key;
    #ssl_session_cache shared:SSL:1m;
    #ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;

    #ssl_session_timeout 5m;
    #ssl_prefer_server_ciphers on;

    #if ($scheme = http) {
    #    return 301 https://$host$request_uri;
    #}


    location / {
        # 容器内网端口是 80（宿主机映射才是 8084）
        proxy_pass http://nginx_php:80;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host  $http_host;
        proxy_set_header X-Nginx-Proxy true;
        proxy_set_header Connection "";
    }
}
