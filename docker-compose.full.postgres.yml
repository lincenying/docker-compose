services:
  mysql:
    container_name: dc-mysql-db
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cyxiaowu
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./web/demo-php/mysql.sql:/home/mysql/mysql.sql
      - /Users/lincenying/web/mysqldb:/var/lib/mysql
    networks:
      - webnet

  postgres:
    container_name: dc-postgres-server
    image: postgres:18.4-alpine
    environment:
      POSTGRES_HOST: 0.0.0.0
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mmfblog_v2
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ${POSTGRES_DIR:-/var/lib/postgresql}:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d mmfblog_v2
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    ports:
      - 5432:5432
    networks:
      - webnet

  api:
    container_name: api-bun-server-postgre
    image: lincenying/bun-api-server-postgre:${TAG}
    env_file:
      - .env
    environment:
      NODE_ENV: production
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 4080:4080
    depends_on:
      api_postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./.data:/app/.data
    networks:
      - webnet

  app:
    container_name: dc-app-vue3-ssr
    image: lincenying/images-mmf-blog-vite-vue3-ssr:${TAG}
    environment:
      API_URL: http://api:4080
    env_file:
      - .env
    depends_on:
      - api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 7777:7777
    networks:
      - webnet

  nuxt:
    container_name: dc-app-nuxt
    image: lincenying/images-mmf-blog-vite-nuxt:${TAG}
    environment:
      NUXT_ENV_API_URL: http://api:4080
    env_file:
      - .env
    depends_on:
      - api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 7200:7200
    networks:
      - webnet

  php-app:
    container_name: dc-php-app-server
    image: lincenying/php-app-server:${TAG}
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./web/demo-php:/home/web/php-template
    networks:
      - webnet
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cyxiaowu
      DB_USERNAME: user
      DB_PASSWORD: password
    env_file:
      - .env

  nginx:
    container_name: dc-nginx
    image: nginx
    depends_on:
      - api
      - app
      - nuxt
      - php-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d.alias:/etc/nginx/conf.d
      - ./nginx/cert:/etc/nginx/cert
      - ./web:/home/web
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
