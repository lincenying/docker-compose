services:
  mysql:
    container_name: dc-db-mysql
    image: mysql:8.4
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-database_name}
      MYSQL_USER: ${MYSQL_USER:-MYSQL_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-MYSQL_password}
    ports:
      - "3306:3306"
    volumes:
      - ./web/sql:/app/mysql
      - ${MYSQL_DIR:-./data/mysqldb}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - webnet
    restart: unless-stopped

  postgres:
    container_name: dc-db-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_HOST: 0.0.0.0
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-POSTGRES_password}
      POSTGRES_DB: ${POSTGRES_DB:-database_name}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ${POSTGRES_DIR:-/var/lib/postgresql}:/var/lib/postgresql
      - ./web/sql:/app/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-database_name}
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - webnet
    restart: unless-stopped

  api:
    container_name: dc-api-bun-postgre
    image: lincenying/api-bun-postgre:${API_POSTGRES_TAG}
    env_file:
      - .env
      - .env.local
    environment:
      NODE_ENV: production
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-POSTGRES_password}
      POSTGRES_DB: ${POSTGRES_DB:-database_name}
      PORT: 4000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 4000:4000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./.data:/app/.data
      # - ./config/api-bun-postgre.production.yaml:/app/config/production.yaml:ro
    networks:
      - webnet
    restart: unless-stopped

  app:
    container_name: dc-app-vue3-ssr
    image: lincenying/app-vue3-ssr:${APP_VUE3_SSR_TAG}
    environment:
      API_URL: http://api:4000
    env_file:
      - .env
    depends_on:
      - api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 7777:7777
    networks:
      - webnet
    restart: unless-stopped

  nuxt:
    container_name: dc-app-nuxt
    image: lincenying/app-nuxt:${APP_NUXT_TAG}
    environment:
      NUXT_ENV_API_URL: http://api:4000
    env_file:
      - .env
      - .env.local
    depends_on:
      - api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 7200:7200
    networks:
      - webnet
    restart: unless-stopped

  app_php:
    container_name: dc-app-php
    image: lincenying/app-php:${APP_PHP_TAG}
    networks:
      - webnet
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-database_name}
      DB_USERNAME: ${MYSQL_USER:-MYSQL_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-MYSQL_password}
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}
    env_file:
      - .env
      - .env.local
    volumes:
      - php-app:/home/web/app-php
      - ./config/php.ini:/usr/local/etc/php/php.ini:ro
      - ./php-update:/home/web/app-php/upload
    # 代码在入口脚本里从 /opt/app-php 同步到共享卷；上传目录权限也由该入口处理
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  nginx:
    container_name: dc-nginx
    image: nginx:alpine
    depends_on:
      api:
        condition: service_started
      app:
        condition: service_started
      nuxt:
        condition: service_started
      app_php:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d.alias:/etc/nginx/conf.d
      - ./nginx/conf.d.php/php.alias.conf:/etc/nginx/conf.d/php.conf
      - ./nginx/cert:/etc/nginx/cert
      - ./nginx/logs:/var/log/nginx
      - ./web:/home/web
      - php-app:/home/web/app-php:ro
      - ./php-update:/home/web/app-php/upload:ro
    networks:
      - webnet
    restart: unless-stopped

  # 与 nginx 共享网络命名空间，通过 iptables 封禁恶意扫描 IP
  fail2ban:
    container_name: dc-fail2ban
    image: crazymax/fail2ban:1
    network_mode: "service:nginx"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: Asia/Shanghai
      F2B_LOG_TARGET: STDOUT
      F2B_LOG_LEVEL: INFO
      F2B_DB_PURGE_AGE: 7d
    volumes:
      - ./nginx/logs:/var/log/nginx:ro
      - ./fail2ban:/data
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  php-app:

networks:
  webnet:
    driver: bridge
