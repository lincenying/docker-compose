services:
  mongo:
    container_name: dc-db-mongo
    image: mongo:4.0
    volumes:
      - ${MONGO_DIR:-./data/mongodb}:/data/db
    ports:
      - 27017:27017
    networks:
      - webnet
    restart: unless-stopped

  mysql:
    container_name: dc-db-mysql
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-database_name}
      MYSQL_USER: ${MYSQL_USER:-MYSQL_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-MYSQL_password}
    ports:
      - "3306:3306"
    volumes:
      - ./web/mysql:/app/mysql
      - ${MYSQL_DIR:-./data/mysqldb}:/var/lib/mysql
    networks:
      - webnet
    restart: unless-stopped

  api:
    container_name: dc-api-express
    image: lincenying/api-express:${API_EXPRESS_TAG}
    environment:
      DATABASE_URL: mongodb://mongo:27017
      PORT: 4000
    ports:
      - 4000:4000
    depends_on:
      - mongo
    networks:
      - webnet
    restart: unless-stopped

  app:
    container_name: dc-app-vue3-ssr
    image: lincenying/app-vue3-ssr:${APP_VUE3_SSR_TAG}
    environment:
      API_URL: http://api:4000
    env_file:
      - .env
    depends_on:
      - api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 7777:7777
    networks:
      - webnet
    restart: unless-stopped

  nuxt:
    container_name: dc-app-nuxt
    image: lincenying/app-nuxt:${APP_NUXT_TAG}
    environment:
      NUXT_ENV_API_URL: http://api:4000
    env_file:
      - .env
    depends_on:
      - api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 7200:7200
    networks:
      - webnet
    restart: unless-stopped

  app_php:
    container_name: dc-app-php
    image: lincenying/app-php:${APP_PHP_TAG}
    networks:
      - webnet
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-database_name}
      DB_USERNAME: ${MYSQL_USER:-MYSQL_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-MYSQL_password}
    env_file:
      - .env
    volumes:
      - ./config/php.ini:/usr/local/etc/php/php.ini:ro
    restart: unless-stopped

  nginx_php:
    container_name: dc-nginx-php
    image: lincenying/nginx-php:${APP_PHP_TAG}
    ports:
      - "8084:80"
    networks:
      - webnet
    depends_on:
      - app_php
    restart: unless-stopped

  nginx:
    container_name: dc-nginx
    image: nginx:alpine
    depends_on:
      - api
      - app
      - nuxt
      - nginx_php
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d.alias:/etc/nginx/conf.d
      - ./nginx/conf.d.php/php.alias.conf:/etc/nginx/conf.d/php.conf
      - ./nginx/cert:/etc/nginx/cert
      - ./nginx/logs:/var/log/nginx
      - ./web:/home/web
    networks:
      - webnet
    restart: unless-stopped

  # 与 nginx 共享网络命名空间，通过 iptables 封禁恶意扫描 IP
  fail2ban:
    container_name: dc-fail2ban
    image: crazymax/fail2ban:1.1.0
    network_mode: "service:nginx"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: Asia/Shanghai
      F2B_LOG_TARGET: STDOUT
      F2B_LOG_LEVEL: INFO
      F2B_DB_PURGE_AGE: 7d
    volumes:
      - ./nginx/logs:/var/log/nginx:ro
      - ./fail2ban:/data
    depends_on:
      - nginx
    restart: unless-stopped

networks:
  webnet:
    driver: bridge
