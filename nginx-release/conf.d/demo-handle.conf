server {
    listen       80;
    listen       443 ssl;

    server_name handle.mmxiaowu.com;

    root "/home/web/demo-handle";

    index "index.html";

    # 腾讯云
    ssl_certificate cert/handle.mmxiaowu.com_bundle.crt;
    ssl_certificate_key cert/handle.mmxiaowu.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    # 阿里云
    #ssl_certificate cert/handle.mmxiaowu.com.pem;
    #ssl_certificate_key cert/handle.mmxiaowu.com.key;
    #ssl_session_cache shared:SSL:1m;
    #ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;

    ssl_session_timeout 5m;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/conf.d/anti-scan.inc;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

