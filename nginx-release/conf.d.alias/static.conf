server {
    listen 80;
    listen 443 ssl;

    server_name static.mmxiaowu.com;

    # 腾讯云
    ssl_certificate cert/static.mmxiaowu.com_bundle.crt;
    ssl_certificate_key cert/static.mmxiaowu.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    # 阿里云
    #ssl_certificate cert/static.mmxiaowu.com.pem;
    #ssl_certificate_key cert/static.mmxiaowu.com.key;
    #ssl_session_cache shared:SSL:1m;
    #ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;

    ssl_session_timeout 5m;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/conf.d/anti-scan.inc;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    location /large/ {
        proxy_set_header Host tvax1.sinaimg.cn;
        proxy_set_header Referer https://weibo.com;
        proxy_pass   https://tvax1.sinaimg.cn;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36";
        # 可选：缓存配置（提升性能）
        proxy_cache_valid 200 30d;
    }

    location / {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET,POST';
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
        root /home/web/static;
        expires 30d;
    }
}
