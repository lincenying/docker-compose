# 扫描敏感路径 → 封禁
[nginx-scanner]
enabled  = true
port     = http,https
filter   = nginx-scanner
logpath  = /var/log/nginx/access.log
backend  = auto
maxretry = 5
findtime = 60
bantime  = 86400
action   = iptables-multiport[name=nginx-scanner, port="http,https"]

# 短时间大量 404 → 封禁（目录爆破）
[nginx-404]
enabled  = true
port     = http,https
filter   = nginx-404
logpath  = /var/log/nginx/access.log
backend  = auto
maxretry = 30
findtime = 60
bantime  = 3600
action   = iptables-multiport[name=nginx-404, port="http,https"]

# 触发限流 429 → 封禁
[nginx-limit-req]
enabled  = true
port     = http,https
filter   = nginx-limit-req
logpath  = /var/log/nginx/access.log
backend  = auto
maxretry = 20
findtime = 60
bantime  = 7200
action   = iptables-multiport[name=nginx-limit-req, port="http,https"]
