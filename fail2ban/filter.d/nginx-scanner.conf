[Definition]
# 1. 敏感路径与设备指纹
# 2. Host 为裸 IP（扫公网地址，不带域名）
# 3. 80 端口上的非 HTTP 协议探测（TLS、Redis、Mongo、SMB、MySQL、PostgreSQL 等），状态码 400
failregex = ^<HOST> .* "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS) .*(?:\.env|/\.git|/\.svn|/svn/|wp-admin|wp-login|xmlrpc|wp-|phpmyadmin|adminer|vendor/phpunit|actuator|/solr/|manager/html|/cgi-bin/|\.aws/|etc/passwd|_ignition|telescope|\.htaccess|\.htpasswd|\.php(?:\?|$)|\.asp(?:\?|$)|\.aspx(?:\?|$)|\.ashx(?:\?|$)|\.rar|\.zip|\.gz|/onvif/|/redfish|/ocpp|/RPC2|/tplus/|/System/Ping|login_psw\.csp|/login/requireLogin|/html/index\.html|/login\.html|/api/v1/version).*"
            ^<HOST> - \[[^\]]+\] "(?:(?:\d{1,3}\.){3}\d{1,3}|\[[0-9A-Fa-f:]+\]|[0-9A-Fa-f]*:[0-9A-Fa-f:]*)" "
            ^<HOST> - \[[^\]]+\] "[^"]*" "(?!(?:GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH|CONNECT|PROPFIND|PRI) )[^"]*" 400

ignoreregex =
