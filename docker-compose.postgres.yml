services:
  postgres:
    container_name: dc-db-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_HOST: 0.0.0.0
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-POSTGRES_password}
      POSTGRES_DB: ${POSTGRES_DB:-mmfblog_v2}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ${POSTGRES_DIR:-/var/lib/postgresql}:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mmfblog_v2}
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - webnet
    restart: unless-stopped

  api:
    container_name: dc-api-bun-postgre
    image: lincenying/api-bun-postgre:${API_POSTGRES_TAG}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-POSTGRES_password}
      POSTGRES_DB: ${POSTGRES_DB:-mmfblog_v2}
      PORT: 4000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 4000:4000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./.data:/app/.data
      # - ./config/api-bun-postgre.production.yaml:/app/config/production.yaml:ro
    networks:
      - webnet
    restart: unless-stopped

  app:
    container_name: dc-app-vue3-ssr
    image: lincenying/app-vue3-ssr:${APP_VUE3_SSR_TAG}
    environment:
      API_URL: http://api:4000
    env_file:
      - .env
    depends_on:
      - api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 7777:7777
    networks:
      - webnet
    restart: unless-stopped

  nuxt:
    container_name: dc-app-nuxt
    image: lincenying/app-nuxt:${APP_NUXT_TAG}
    environment:
      NUXT_ENV_API_URL: http://api:4000
    env_file:
      - .env
    depends_on:
      - api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 7200:7200
    networks:
      - webnet
    restart: unless-stopped

  nginx:
    container_name: dc-nginx
    image: nginx:alpine
    depends_on:
      - api
      - app
      - nuxt
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d.alias:/etc/nginx/conf.d
      - ./nginx/cert:/etc/nginx/cert
      - ./nginx/logs:/var/log/nginx
      - ./web:/home/web
    networks:
      - webnet
    restart: unless-stopped

  # 与 nginx 共享网络命名空间，通过 iptables 封禁恶意扫描 IP
  fail2ban:
    container_name: dc-fail2ban
    image: crazymax/fail2ban:1
    network_mode: "service:nginx"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: Asia/Shanghai
      F2B_LOG_TARGET: STDOUT
      F2B_LOG_LEVEL: INFO
      F2B_DB_PURGE_AGE: 7d
    volumes:
      - ./nginx/logs:/var/log/nginx:ro
      - ./fail2ban:/data
    depends_on:
      - nginx
    restart: unless-stopped

networks:
  webnet:
    driver: bridge
